[package]
name = "polyforge"
version = "0.1.0"
edition = "2024"

# M1 PROTOTYPE (throwaway): ratatui + crossterm only.
# tokio / serde / persistence arrive in M2 alongside the first real provider.

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
